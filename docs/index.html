<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #FBF8F2;
      --ink:          #211C16;
      --ink-muted:    #6B6057;
      --ink-faint:    #A89F94;
      --border:       #DDD5C8;
      --border-light: #EDE7DE;
      --amber:        #E0922F;
      --amber-dim:    #C47820;
      --card:         #FFFFFF;
      --font-display: 'Fraunces', 'Georgia', serif;
      --font-body:    'IBM Plex Sans', 'Helvetica Neue', sans-serif;
      --font-mono:    'IBM Plex Mono', 'Menlo', 'Courier New', monospace;
      --radius-lg:    14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(3rem, 8vw, 6rem) 1.5rem 5rem;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber-dim);
      margin: 0 0 1rem;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 1rem;
    }
    .lede {
      font-size: 1.1rem;
      color: var(--ink-muted);
      max-width: 52ch;
      margin: 0 0 3rem;
    }
    .docs-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }
    .doc-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.4rem 1.6rem;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .doc-card:hover {
      border-color: var(--amber);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -12px rgba(33,28,22,.25);
    }
    .doc-card .title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }
    .doc-card .title .arrow { color: var(--amber-dim); font-weight: 400; }
    .doc-card .desc {
      color: var(--ink-muted);
      font-size: 0.95rem;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Docs</p>
    <h1>Project documentation</h1>
    <p class="lede">A small collection of published project-context documents, rendered as standalone pages.</p>

    <ul class="docs-list">
      <li>
        <a class="doc-card" href="./polymarket-alerts-docs.html">
          <span class="title">
            Polymarket → Telegram Threshold Alerts
            <span class="arrow">→</span>
          </span>
          <span class="desc">Project context: architecture, integration scope, alerting strategy, and design decisions.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
